model:
  name: Qwen/Qwen3.5-2B-Base
  output_dir: ./outputs/qwen35-personal
  adapter_dir: ./adapters/personal

training:
  max_seq_length: 1024
  learning_rate: 0.0002
  num_train_epochs: 2
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  warmup_ratio: 0.03
  logging_steps: 10
  save_steps: 250

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear

quantization:
  load_in_4bit: true
  quant_type: nf4
  compute_dtype: bfloat16
